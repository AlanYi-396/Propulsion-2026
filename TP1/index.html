<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Motores Pistoneros - Predimensionamiento Aeronáutico</title>
    <link rel="icon" type="image/jpeg" href="./assets/FAVICON.jpg">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Kendo UI for jQuery (local) -->
    <link rel="stylesheet" href="./KENDO/styles/kendo.common.min.css">
    <link rel="stylesheet" href="./KENDO/styles/kendo.default.min.css">
    <link rel="stylesheet" href="./KENDO/styles/kendo.dataviz.min.css">
    <link rel="stylesheet" href="./KENDO/styles/kendo.dataviz.default.min.css">
    <script src="./KENDO/js/kendo.all.min.js"></script>
    
    <!-- Estilos propios -->
    <link rel="stylesheet" href="general.css">
</head>
<body>
    <div id="app">
        <div class="row">
            <!-- Panel Izquierdo (30%) --> 
            <div class="panel left">
                <!-- Hero Section -->
                <div class="card hero">
                    <div class="hero-img"></div>
                    <div class="hero-text">
                        <div class="title">Predimensionador de Motores</div>
                        <!--<div class="small">Cálculo de ciclos termodinámicos alternativos</div>-->
                    </div>
                </div>

                <!-- Sección de Parámetros de Entrada -->
                <div class="card inputs">
                    <div class="small"><b>Parámetros de Entrada</b></div>
                    <form id="parametros-form">
                        <div class="form-columns">
                            <div class="form-group">
                                <label for="rpm">RPM:</label>
                                <input type="text" id="rpm" name="rpm" class="kendo-numeric" data-tipo="adimensional">
                            </div>
                            <div class="form-group">
                                <label for="potencia">Potencia:</label>
                                <div class="campo-con-unidad">
                                    <input type="text" id="potencia" name="potencia" class="parseado" placeholder="Ej: 150" data-tipo="potencia">
                                    <select id="unidad-potencia" class="dropdown-unidad">
                                        <option value="kw">kW</option>
                                        <option value="hp">HP</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="altitud">Altitud:</label>
                                <div class="campo-con-unidad">
                                    <input type="text" id="altitud" name="altitud" class="parseado" placeholder="Ej: 2.500" data-tipo="altitud">
                                    <select id="unidad-altitud" class="dropdown-unidad">
                                        <option value="m">m</option>
                                        <option value="ft">ft</option>
                                        <option value="km">km</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="mezcla-relativa">Relación Compresión:</label>
                                <input type="text" id="mezcla-relativa" name="mezcla-relativa" class="kendo-numeric" data-tipo="adimensional">
                            </div>
                            <div class="form-group">
                                <label for="k-aire">k del Aire (γ):</label>
                                <input type="text" id="k-aire" name="k-aire" class="kendo-numeric" value="1.4">
                            </div>
                            <div class="form-group">
                                <label for="rendimiento-mecanico">Rend. Mecánico:</label>
                                <input type="text" id="rendimiento-mecanico" name="rendimiento-mecanico" class="kendo-numeric" data-tipo="adimensional">
                            </div>
                        </div>
                        
                        <div class="form-columns" style="margin: 5px 0;">
                            <div class="form-group">
                                <label for="ciclo-selector">Ciclo:</label>
                                <select id="ciclo-selector">
                                    <option value="otto">Ciclo Otto</option>
                                    <option value="diesel">Ciclo Diesel</option>
                                    <option value="sabath">Ciclo Sabathé</option>
                                    <option value="comparacion">Comparativa</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="delta-t-in">ΔT_in [K]:</label>
                                <input type="text" id="delta-t-in" name="delta-t-in" class="kendo-numeric" data-tipo="adimensional">
                            </div>
                        </div>

                        <div class="btns">
                            <button type="reset" class="btn-secondary">Limpiar</button>
                            <button type="button" id="btn-calcular" class="btn-primary">Calcular</button>
                        </div>
                    </form>
                </div>

                <!-- Historial -->
                <div class="card grow">
                    <div class="head">Historial</div>
                    <div id="historial-scroll">
                        <table id="historial-table">
                            <thead>
                                <tr><th>Fecha</th><th>Ciclo</th><th>Acción</th></tr>
                            </thead>
                            <tbody id="historial-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Panel Derecho (70%) -->
            <div class="panel right">
                <!-- Tabla Estados y Tiempos del Ciclo (cabecera generada por JS dentro de la tabla) -->
                <div class="card shrink" style="padding: 0;">
                    <table id="tabla-estados" style="margin: 0;"></table>
                </div>

                <!-- Gráficos -->
                <div class="graphs">
                    <div class="card graph">
                        <div class="head">
                            Gráfico P-V (Clapeyron)
                            <select id="ciclo-pv">
                                <option value="otto">Otto</option>
                                <option value="diesel">Diesel</option>
                                <option value="sabath">Sabathé</option>
                            </select>
                        </div>
                        <div class="plot" id="plot-pv"></div>
                    </div>
                    <div class="card graph">
                        <div class="head">
                            Gráfico T-S
                            <select id="ciclo-ts">
                                <option value="otto">Otto</option>
                                <option value="diesel">Diesel</option>
                                <option value="sabath">Sabathé</option>
                            </select>
                        </div>
                        <div class="plot" id="plot-ts"></div>
                    </div>
                    <div class="card graph">
                        <div class="head">η<sub>t</sub> vs Relación de Compresión</div>
                        <div class="plot" id="plot-eta"></div>
                    </div>
                </div>

                <!-- Resumen del Ciclo -->
                <div class="card summary shrink">
                    <div class="head">Resumen del Ciclo</div>
                    <table id="tabla-resumen">
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Pop-up Modal de Consulta de Historial -->
    <div id="historial-modal" class="historial-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <span id="modal-fecha">dd-mm-yyyy - HH:MM:SS</span> | Ciclo: <span id="modal-ciclo">--</span>
                </div>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <table id="modal-datos-table">
                    <thead>
                        <tr><th>Parámetro</th><th>Valor</th><th>Unidad</th></tr>
                    </thead>
                    <tbody id="modal-datos-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts propios -->
    <script src="componentes/ciclos-motores.js"></script>
    <script src="behaviour.js"></script>
</body>
</html>
